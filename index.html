<title>Каруселі iamsonia.psy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500;1,600&family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: робочий стіл редактора. Ліворуч слайди і поля, праворуч липке прев'ю 4:5 з експортом і перевіркою. */
:root{
  --bg:#F5F0EE; --surface:#FFFFFF; --surface-2:#FBF7F5; --ink:#2F3247; --muted:#6C6F83; --line:#E6DDD9;
  --accent:#4E7367; --accent-ink:#FFFFFF; --accent-soft:#E2ECE8; --sky:#DCEFFF; --warn:#9A5B12; --warn-soft:#FBEBD5;
  --bad:#A33A3A; --bad-soft:#F8E1E1; --good:#3E6F5F; --good-soft:#DFEEE7;
  --f-display:"Cormorant","Georgia",serif; --f-body:"Onest","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1C1E2C; --surface:#262938; --surface-2:#2C2F40; --ink:#F2ECEA; --muted:#A6A9BC; --line:#3A3D52;
  --accent:#8FB7A9; --accent-ink:#16201D; --accent-soft:#2B3C37; --sky:#283D50; --warn:#E7B46E; --warn-soft:#3D3122;
  --bad:#EE9A9A; --bad-soft:#432A2D; --good:#93C9B5; --good-soft:#243A33; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1C1E2C; --surface:#262938; --surface-2:#2C2F40; --ink:#F2ECEA; --muted:#A6A9BC; --line:#3A3D52;
  --accent:#8FB7A9; --accent-ink:#16201D; --accent-soft:#2B3C37; --sky:#283D50; --warn:#E7B46E; --warn-soft:#3D3122;
  --bad:#EE9A9A; --bad-soft:#432A2D; --good:#93C9B5; --good-soft:#243A33; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;max-width:1240px;margin:0 auto;padding-block:18px 14px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand b{font:italic 600 30px/1 var(--f-display);letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs a{padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.save{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:96px}
.save i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.save[data-s="saving"] i{background:var(--warn)} .save[data-s="error"] i{background:var(--bad)}
.banner{max-width:1240px;margin:0 auto 12px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13.5px}

main{max-width:1240px;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 12px;font-weight:600;font-size:14px}
.panel-h small{color:var(--muted);font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
input[type=text],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:15px;color:var(--ink)}
textarea{resize:vertical;line-height:1.45;min-height:70px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}

/* editor */
.ed-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.ed-top select{flex:1 1 240px;max-width:460px;font-weight:600}
.ed-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,430px);gap:16px;align-items:start}
.ed-grid>.c1{grid-column:1;min-width:0}
.aside{grid-column:2;grid-row:1 / span 3;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:12px}
@media (max-width:860px){ .ed-grid{grid-template-columns:minmax(0,1fr)} .aside{grid-column:1;grid-row:auto;position:static} }

.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.thumb{flex:0 0 auto;width:84px;border:2px solid transparent;border-radius:10px;padding:2px;background:none;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:stretch}
.thumb span{font-size:11.5px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb[aria-current="true"]{border-color:var(--accent)}
.thumb .fit{border-radius:7px}
.fit{position:relative;width:100%;max-width:100%;aspect-ratio:4/5;overflow:hidden;background:var(--surface-2)}
.stage{position:absolute;top:0;left:0;width:1080px;height:1350px;transform-origin:0 0}
.preview .fit{border-radius:12px;box-shadow:0 10px 30px rgba(30,32,48,.12)}
.pv-nav{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--muted)}

.types{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sw{display:flex;gap:8px;align-items:center}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.sw button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
.tool{display:flex;gap:4px;margin-bottom:-4px}
.tool button{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;min-width:32px;height:28px;cursor:pointer;font-size:13px}
.tool .i{font:italic 600 17px var(--f-display)}
.hint{font-size:12.5px;color:var(--muted)}
.hint code{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 4px;font-size:12px}
.range{display:grid;grid-template-columns:72px 1fr 40px;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.range input{width:100%;accent-color:var(--accent)}
.split-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sub{border:1px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}

.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.35}
.checks .m{flex:0 0 20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.ok .m{background:var(--good-soft);color:var(--good)} .no .m{background:var(--warn-soft);color:var(--warn)} .bad .m{background:var(--bad-soft);color:var(--bad)}
.checks label{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.checks input{accent-color:var(--accent);margin:2px 0 0;width:16px;height:16px}
.found{font-size:12.5px;color:var(--bad)}

/* plan */
.plan-h{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.plan-h h2{font:italic 600 28px/1.1 var(--f-display);margin:0 auto 0 0}
.goal{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.dots{display:flex;gap:4px}.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--accent)}.dots i.on{background:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:150px;display:flex;flex-direction:column;gap:6px;min-width:0}
.day.today{border-color:var(--accent)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted)}
.day-h b{font:600 20px/1 var(--f-body);color:var(--ink);font-variant-numeric:tabular-nums}
.pc{border:0;text-align:left;border-radius:9px;padding:7px 9px;background:var(--surface-2);cursor:pointer;display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.3;width:100%}
.pc b{font-weight:600;overflow-wrap:anywhere}
.add-day{margin-top:auto;border:1px dashed var(--line);background:none;border-radius:9px;padding:5px;color:var(--muted);cursor:pointer;font-size:13px}
@media (max-width:860px){ .week{grid-template-columns:minmax(0,1fr)} .day{min-height:0} }
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;align-self:flex-start}
.st-idea{background:var(--surface);color:var(--muted);border:1px solid var(--line)} .st-text{background:var(--sky);color:var(--ink)}
.st-design{background:var(--warn-soft);color:var(--warn)} .st-ready{background:var(--good-soft);color:var(--good)} .st-posted{background:var(--accent);color:var(--accent-ink)}
.list{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.lrow .t{min-width:0;display:flex;flex-direction:column;gap:2px}
.lrow .t small{color:var(--muted)}
.section-t{font-weight:600;margin:22px 0 10px;font-size:14px}

/* ideas */
.ideas-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){ .ideas-grid{grid-template-columns:minmax(0,1fr)} }
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.idea p{margin:0;font-size:15px;overflow-wrap:anywhere}
.idea .meta{font-size:12px;color:var(--muted)}
.kind{font:italic 600 16px var(--f-display);color:var(--accent)}

.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty h2{font:italic 600 34px/1.1 var(--f-display);color:var(--ink);margin:0 0 8px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(20,22,34,.45);display:grid;place-items:center;padding:20px;z-index:50}
.modal>div{background:var(--surface);border-radius:16px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.lib button{border:0;padding:0;border-radius:8px;overflow:hidden;cursor:pointer;aspect-ratio:4/5;background:var(--surface-2) center/cover no-repeat}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
#exportHost{position:fixed;left:-12000px;top:0;width:1080px;height:1350px;pointer-events:none}

/* ===== СЛАЙДИ (1080 × 1350). Кольори тут це контент, а не тема інтерфейсу ===== */
.sl{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:"Onest",sans-serif;color:#4D5270;-webkit-font-smoothing:antialiased}
.sl b{font-weight:800}
.sl em{font-family:"Cormorant",serif;font-style:italic;font-weight:600;font-size:1.16em;letter-spacing:-.005em}
.sl-img{position:absolute;inset:0}
.sl-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:500 34px "Onest";color:rgba(250,241,240,.75);background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 40px,rgba(255,255,255,0) 40px 80px)}
.sl-foot{position:absolute;left:72px;right:72px;bottom:54px;display:flex;justify-content:space-between;font:600 28px/1 "Onest";letter-spacing:.02em}
.sl-cover .sl-scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(32,34,52,.82) 0%,rgba(32,34,52,.45) 34%,rgba(32,34,52,0) 62%)}
.sl-cover .sl-bottom{position:absolute;left:72px;right:72px;bottom:140px;display:flex;flex-direction:column;gap:26px;color:#FAF1F0}
.sl-cover .sl-hook{font-weight:800;line-height:1.04;letter-spacing:-.02em}
.sl-cover .sl-sub{font:500 38px/1.3 "Onest";opacity:.92}
.sl-cover .sl-foot{color:#FAF1F0}
.sl-notes .note{position:absolute;left:84px;right:84px;top:0;bottom:0;display:flex;align-items:center}
.sl-notes .card{width:100%;background:#FFFFFF;border-radius:46px;padding:44px 60px 60px;box-shadow:0 30px 90px rgba(20,22,34,.30);color:#1C1C1E}
.sl-notes .bar{display:flex;justify-content:space-between;align-items:center;color:#D9A400;font:600 34px/1 "Onest";margin-bottom:26px}
.sl-notes .date{text-align:center;color:#8E8E93;font:500 24px/1 "Onest";margin-bottom:30px}
.sl-notes h3{margin:0 0 22px;font:800 60px/1.08 "Onest";letter-spacing:-.015em}
.sl-notes .tx{font:400 42px/1.4 "Onest"}
.sl-notes .sl-foot{color:#FAF1F0;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.sl-split{display:grid;grid-template-columns:1fr 1fr}
.sl-split .col{padding:230px 54px 150px 72px;display:flex;flex-direction:column;gap:34px}
.sl-split .col+.col{padding:230px 72px 150px 54px}
.sl-split .lab{font:italic 600 92px/1 "Cormorant";letter-spacing:-.01em}
.sl-split ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:30px}
.sl-split li{font:500 38px/1.3 "Onest";padding-top:26px;border-top:2px solid currentColor;border-color:rgba(77,82,112,.18)}
.sl-split .on-dark li{border-color:rgba(250,241,240,.28)}
.sl-split .head{position:absolute;left:0;right:0;top:86px;text-align:center;font:700 34px/1.2 "Onest";letter-spacing:.14em;text-transform:uppercase}
.sl-split .vs{position:absolute;left:480px;top:620px;width:120px;height:120px;border-radius:60px;display:flex;align-items:center;justify-content:center;font:italic 600 60px/1 "Cormorant";box-shadow:0 10px 30px rgba(20,22,34,.18)}
.sl-object .ph{position:absolute;left:0;right:0;top:0;height:860px}
.sl-object .txt{position:absolute;left:0;right:0;top:860px;bottom:0;padding:64px 72px 130px;display:flex;flex-direction:column;gap:22px}
.sl-object h3{margin:0;font-weight:800;line-height:1.06;letter-spacing:-.02em}
.sl-object .tx{font:400 38px/1.38 "Onest"}
.sl-mixed .in{position:absolute;inset:0;padding:120px 96px 160px;display:flex;flex-direction:column;justify-content:center;gap:48px}
.sl-mixed h3{margin:0;font-weight:700;line-height:1.14;letter-spacing:-.02em}
.sl-mixed h3 em{font-weight:500;font-size:1.2em}
.sl-mixed .tx{font:400 40px/1.4 "Onest";max-width:820px}
.sl-meme .in{position:absolute;inset:0;padding:110px 72px 140px;display:flex;flex-direction:column;gap:44px}
.sl-meme h3{margin:0;font:700 56px/1.15 "Onest";letter-spacing:-.01em}
.sl-meme .frame{flex:1;border-radius:34px;position:relative;overflow:hidden}
.sl-meme .frame.empty{border:4px dashed rgba(77,82,112,.3);display:flex;align-items:center;justify-content:center;font:500 36px "Onest";opacity:.7}
.sl-meme .tx{font:400 36px/1.35 "Onest"}
.sl-cta .in{position:absolute;inset:0;padding:140px 96px 170px;display:flex;flex-direction:column;justify-content:center;gap:40px}
.sl-cta h3{margin:0;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.sl-cta .tx{font:400 42px/1.4 "Onest"}
.sl-cta .btns{display:flex;flex-direction:column;gap:22px;margin-top:16px}
.sl-cta .btns span{align-self:flex-start;border:3px solid currentColor;border-radius:999px;padding:22px 40px;font:600 38px/1 "Onest"}
.sl-cta .btns span:first-child{border-color:transparent}
</style>

<header class="top">
  <div class="brand"><b>iamsonia.psy</b><span>каруселі</span></div>
  <nav class="tabs" aria-label="Розділи">
    <a href="#editor" data-view="editor">Конструктор</a>
    <a href="#plan" data-view="plan">Контент-план</a>
    <a href="#ideas" data-view="ideas">Ідеї</a>
  </nav>
  <div class="save" id="save" data-s="ok" role="status"><i></i><span>Завантажую…</span></div>
</header>
<div class="banner" id="banner" hidden></div>

<main>
  <!-- КОНСТРУКТОР -->
  <section id="view-editor">
    <div id="edEmpty" class="empty" hidden>
      <h2>Тут з’являться твої каруселі</h2>
      <p>Створи пост із готової структури: обкладинка, мем, порівняння, нотатка, акцент і заклик до дії.</p>
      <button class="btn primary" data-act="new-post">+ Створити пост із шаблону</button>
    </div>
    <div id="edWork" hidden>
      <div class="ed-top">
        <label class="sr" for="postPick">Пост</label>
        <select id="postPick"></select>
        <button class="btn primary" data-act="new-post">+ Новий пост</button>
        <button class="btn" data-act="dup-post">Дублювати</button>
        <button class="btn ghost danger" data-act="del-post">Видалити</button>
      </div>
      <div class="ed-grid">
        <div class="panel c1">
          <div class="panel-h">Слайди <small id="slideCount"></small></div>
          <div class="strip" id="strip"></div>
          <div class="row" style="margin-top:10px">
            <label class="sr" for="addSlide">Додати слайд</label>
            <select id="addSlide" style="max-width:260px"></select>
          </div>
        </div>
        <div class="aside">
          <div class="preview">
            <div class="fit" id="preview"></div>
            <div class="pv-nav">
              <button class="btn small" data-act="prev-slide" aria-label="Попередній слайд">‹</button>
              <span id="pvLabel"></span>
              <button class="btn small" data-act="next-slide" aria-label="Наступний слайд">›</button>
            </div>
          </div>
          <div class="panel">
            <div class="panel-h">Експорт</div>
            <div class="row">
              <button class="btn" data-act="png-one">PNG цього слайду</button>
              <button class="btn primary" data-act="png-all">Усі слайди, ZIP</button>
              <button class="btn" data-act="copy-text">Скопіювати текст</button>
            </div>
          </div>
          <div class="panel">
            <div class="panel-h">Перевірка</div>
            <ul class="checks" id="checks"></ul>
          </div>
        </div>
        <div class="panel c1" id="slideForm"></div>
        <div class="panel c1" id="metaForm"></div>
      </div>
    </div>
  </section>

  <!-- КОНТЕНТ-ПЛАН -->
  <section id="view-plan" hidden>
    <div class="plan-h">
      <h2 id="weekTitle"></h2>
      <div class="goal"><span id="goalText"></span><span class="dots" id="goalDots"></span></div>
      <button class="btn small" data-act="week-prev" aria-label="Попередній тиждень">‹</button>
      <button class="btn small" data-act="week-now">Цей тиждень</button>
      <button class="btn small" data-act="week-next" aria-label="Наступний тиждень">›</button>
    </div>
    <div class="week" id="week"></div>
    <div class="section-t">Без дати</div>
    <div class="list" id="undated"></div>
  </section>

  <!-- ІДЕЇ -->
  <section id="view-ideas" hidden>
    <div class="ideas-grid">
      <form class="panel stack" id="ideaForm">
        <div class="panel-h" style="margin:0">Нова ідея</div>
        <label class="f" for="ideaText">Тема, хук, мем чи метафора
          <textarea id="ideaText" rows="3" placeholder="Наприклад: самотність у парі, коли поруч, але не разом"></textarea></label>
        <div class="grid2">
          <label class="f" for="ideaKind">Тип<select id="ideaKind"></select></label>
          <label class="f" for="ideaRubric">Рубрика<select id="ideaRubric"></select></label>
        </div>
        <button class="btn primary" type="submit">Зберегти ідею</button>
      </form>
      <div class="stack">
        <div class="row" id="ideaFilter"></div>
        <div class="cards" id="ideaList"></div>
      </div>
    </div>
  </section>
</main>

<div class="modal" id="modal" hidden><div id="modalBody"></div></div>
<div class="toast" id="toast" hidden></div>
<div id="exportHost" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- довідники ---------- */
const PAL = { sage:'#6D9286', powder:'#FAF1F0', blue:'#CBE8FF', navy:'#4D5270' };
const PAL_NAME = { sage:'Шавлія', powder:'Пудра', blue:'Блакитний', navy:'Графіт' };
const INK = { sage:'#FAF1F0', navy:'#FAF1F0', powder:'#4D5270', blue:'#4D5270' };
const TYPES = {
  cover:'Обкладинка', meme:'Мем', split:'Порівняння X vs Y', notes:'Нотатка на фото',
  object:'Фото предмета', mixed:'Змішаний шрифт', cta:'Заклик до дії'
};
const RUBRICS = ['Залежність і контрзалежність','Стосунки','Робота і реалізація','Гроші','Опора','Цінності'];
const STATUSES = [['idea','Ідея'],['text','Текст'],['design','Дизайн'],['ready','Готово'],['posted','Опубліковано']];
const STATUS_NAME = Object.fromEntries(STATUSES);
const KINDS = ['Тема','Хук','Мем','Метафора'];
const WEEK_GOAL = 3;
const DAYS = ['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];

/* ---------- стан ---------- */
let posts = {}, ideas = {};
let curId = null, curSlide = 0, weekOffset = 0, ideaKindFilter = '';
let loaded = { posts:false, ideas:false };
const dirty = new Set();
const tempPhotos = {};

/* ---------- можливості сторінки ---------- */
const capP = {};
function cap(n){
  if (!capP[n]) capP[n] = (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  return capP[n];
}

const LS = 'iamsonia-carousel:';
const lsGet = c => { try { return JSON.parse(localStorage.getItem(LS + c) || '{}'); } catch { return {}; } };
const lsSet = (c, o) => { try { localStorage.setItem(LS + c, JSON.stringify(o)); } catch {} };
const store = {
  db:null,
  async init(){ this.db = await cap('db'); return !!this.db; },
  listen(col, cb){
    if (!this.db){ cb(lsGet(col)); return; }
    let t = setTimeout(() => cb(null, {code:'timeout'}), 10000);
    this.db.collection(col).onSnapshot(s => {
      clearTimeout(t); const o = {}; s.docs.forEach(d => { o[d.id] = d.data(); }); cb(o);
    }, e => { clearTimeout(t); cb(null, e); });
  },
  async set(col, id, data){
    if (this.db) return this.db.doc(col + '/' + id).set(data);
    const o = lsGet(col); o[id] = data; lsSet(col, o);
  },
  async del(col, id){
    if (this.db) return this.db.doc(col + '/' + id).delete();
    const o = lsGet(col); delete o[id]; lsSet(col, o);
  }
};

/* ---------- форматування тексту ---------- */
function fmt(t){
  let s = esc(t || '');
  s = s.replace(/-&gt;/g, '→');
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  s = s.replace(/(^|[\s(«"„])_(.+?)_(?=$|[\s.,!?:;»)"…])/gm, '$1<em>$2</em>');
  return s.replace(/\n/g, '<br>');
}
const plain = t => String(t || '').replace(/\*\*(.+?)\*\*/g, '$1').replace(/(^|[\s(«"„])_(.+?)_(?=$|[\s.,!?:;»)"…])/gm, '$1$2').replace(/->/g, '→');
const lines = t => String(t || '').split('\n').map(x => x.trim()).filter(Boolean);

function photoURL(ph){
  if (!ph || !ph.id) return '';
  if (ph.id.startsWith('tmp_')) return tempPhotos[ph.id] || '';
  return '/_blob/' + ph.id;
}
function bgStyle(ph, W, H, mode){
  const url = photoURL(ph); if (!url) return '';
  const w = ph.w || W, h = ph.h || H;
  const base = mode === 'contain' ? Math.min(W / w, H / h) : Math.max(W / w, H / h);
  const s = base * (ph.zoom || 1);
  return `background-image:url('${url}');background-size:${Math.round(w*s)}px ${Math.round(h*s)}px;background-position:${ph.x ?? 50}% ${ph.y ?? 50}%;background-repeat:no-repeat;`;
}
function noteDate(p){
  const d = p.date ? new Date(p.date + 'T10:24') : new Date();
  return d.toLocaleDateString('uk-UA', { day:'numeric', month:'long', year:'numeric' }) + ' о 10:24';
}

/* ---------- рендер слайду ---------- */
function slideHTML(p, s, i, n){
  const k = s.scale || 1;
  const bg = PAL[s.bg] || PAL.powder, ink = INK[s.bg] || INK.powder;
  const foot = (col, right) => `<div class="sl-foot" style="color:${col}"><span>@iamsonia.psy</span><span>${right ?? (i+1) + '/' + n}</span></div>`;
  switch (s.type){
    case 'cover': return `<div class="sl sl-cover" style="background:${PAL.sage}">
        <div class="sl-img" style="${bgStyle(s.photo,1080,1350,'cover')}"></div>
        ${photoURL(s.photo) ? '' : '<div class="sl-ph">Фото з фотосесії</div>'}
        <div class="sl-scrim"></div>
        <div class="sl-bottom"><div class="sl-hook" style="font-size:${Math.round(96*k)}px">${fmt(s.heading)}</div>
        ${s.body ? `<div class="sl-sub">${fmt(s.body)}</div>` : ''}</div>
        <div class="sl-foot"><span>@iamsonia.psy</span><span>гортай →</span></div></div>`;
    case 'notes': return `<div class="sl sl-notes" style="background:${PAL.navy}">
        <div class="sl-img" style="${bgStyle(s.photo,1080,1350,'cover')}"></div>
        ${photoURL(s.photo) ? '' : '<div class="sl-ph" style="align-items:flex-start;padding-top:80px">Твоє фото на фоні</div>'}
        <div class="note"><div class="card" style="font-size:${Math.round(42*k)}px">
          <div class="bar"><span>‹ Нотатки</span><span>•••</span></div>
          <div class="date">${esc(noteDate(p))}</div>
          ${s.heading ? `<h3 style="font-size:${Math.round(60*k)}px">${fmt(s.heading)}</h3>` : ''}
          <div class="tx" style="font-size:${Math.round(42*k)}px">${fmt(s.body)}</div>
        </div></div>${foot('#FAF1F0')}</div>`;
    case 'split': {
      const lb = PAL[s.leftBg] || PAL.powder, rb = PAL[s.rightBg] || PAL.blue;
      const li = INK[s.leftBg] || INK.powder, ri = INK[s.rightBg] || INK.blue;
      const dl = li === '#FAF1F0' ? 'on-dark' : '', dr = ri === '#FAF1F0' ? 'on-dark' : '';
      const fs = Math.round(38*k);
      const list = t => lines(t).map(x => `<li style="font-size:${fs}px">${fmt(x)}</li>`).join('');
      return `<div class="sl sl-split">
        <div class="col ${dl}" style="background:${lb};color:${li}"><div class="lab">${fmt(s.leftLabel)}</div><ul>${list(s.leftText)}</ul></div>
        <div class="col ${dr}" style="background:${rb};color:${ri}"><div class="lab">${fmt(s.rightLabel)}</div><ul>${list(s.rightText)}</ul></div>
        ${s.heading ? `<div class="head" style="color:${li}"><span style="color:${li}">${esc(plain(s.heading))}</span></div>` : ''}
        <div class="vs" style="background:${PAL.powder};color:${PAL.navy}">vs</div>
        <div class="sl-foot"><span style="color:${li}">@iamsonia.psy</span><span style="color:${ri}">${i+1}/${n}</span></div></div>`;
    }
    case 'object': return `<div class="sl sl-object" style="background:${bg};color:${ink}">
        <div class="ph" style="background-color:${PAL.navy};${bgStyle(s.photo,1080,860,'cover')}">${photoURL(s.photo) ? '' : '<div class="sl-ph">Фото предмета</div>'}</div>
        <div class="txt"><h3 style="font-size:${Math.round(76*k)}px">${fmt(s.heading)}</h3>${s.body ? `<div class="tx" style="font-size:${Math.round(38*k)}px">${fmt(s.body)}</div>` : ''}</div>
        ${foot(ink)}</div>`;
    case 'mixed': return `<div class="sl sl-mixed" style="background:${bg};color:${ink}">
        <div class="in"><h3 style="font-size:${Math.round(86*k)}px">${fmt(s.heading)}</h3>${s.body ? `<div class="tx" style="font-size:${Math.round(40*k)}px">${fmt(s.body)}</div>` : ''}</div>
        ${foot(ink)}</div>`;
    case 'meme': {
      const has = !!photoURL(s.photo);
      return `<div class="sl sl-meme" style="background:${bg};color:${ink}">
        <div class="in">${s.heading ? `<h3 style="font-size:${Math.round(56*k)}px">${fmt(s.heading)}</h3>` : ''}
        <div class="frame ${has ? '' : 'empty'}" style="${has ? bgStyle(s.photo, 936, s.heading ? 860 : 1000, 'contain') : ''}">${has ? '' : 'Сюди мем'}</div>
        ${s.body ? `<div class="tx" style="font-size:${Math.round(36*k)}px">${fmt(s.body)}</div>` : ''}</div>
        ${foot(ink)}</div>`;
    }
    case 'cta': {
      const pillBg = s.bg === 'navy' || s.bg === 'sage' ? PAL.powder : PAL.navy;
      const pillInk = s.bg === 'navy' || s.bg === 'sage' ? PAL.navy : PAL.powder;
      const btns = lines(s.buttons).map((x, j) => `<span style="${j === 0 ? `background:${pillBg};color:${pillInk};` : ''}">${esc(plain(x))}</span>`).join('');
      return `<div class="sl sl-cta" style="background:${bg};color:${ink}">
        <div class="in"><h3 style="font-size:${Math.round(96*k)}px">${fmt(s.heading)}</h3>${s.body ? `<div class="tx" style="font-size:${Math.round(42*k)}px">${fmt(s.body)}</div>` : ''}
        ${btns ? `<div class="btns">${btns}</div>` : ''}</div>${foot(ink)}</div>`;
    }
  }
  return '<div class="sl"></div>';
}

/* масштабоване прев'ю */
const ro = new ResizeObserver(es => es.forEach(e => fitStage(e.target)));
function fitStage(w){ const st = w.firstElementChild; if (st) st.style.transform = `scale(${w.clientWidth / 1080})`; }
function mount(w, html){ w.innerHTML = `<div class="stage">${html}</div>`; fitStage(w); ro.observe(w); }

/* ---------- шаблони ---------- */
function blankSlide(type){
  const b = { id:uid(), type, scale:1 };
  switch (type){
    case 'cover': return {...b, heading:'Хук, який **зупиняє скрол**', body:'', photo:null};
    case 'meme': return {...b, bg:'powder', heading:'Підпис до мему', body:'', photo:null};
    case 'split': return {...b, heading:'', leftLabel:'Залежність', leftText:'Перший пункт\nДругий пункт\nТретій пункт', leftBg:'powder', rightLabel:'Контрзалежність', rightText:'Перший пункт\nДругий пункт\nТретій пункт', rightBg:'blue'};
    case 'notes': return {...b, heading:'Заголовок нотатки', body:'Основний текст, а **ключова фраза** жирним.', photo:null};
    case 'object': return {...b, bg:'powder', heading:'Заголовок до фото', body:'Коротке пояснення.', photo:null};
    case 'mixed': return {...b, bg:'navy', heading:'Думка з _акцентом_ -> і висновок', body:''};
    case 'cta': return {...b, bg:'blue', heading:'Впізнаєш себе?', body:'Розберемо твою ситуацію на онлайн-консультації.', buttons:'Запис у Direct\nПосилання в шапці профілю\nЗбережи пост, щоб не загубити'};
  }
}
function newPost(opts = {}){
  const id = uid();
  const slides = ['cover','meme','split','notes','mixed','cta'].map(blankSlide);
  if (opts.idea) slides[0].heading = opts.idea;
  posts[id] = { title: opts.idea ? plain(opts.idea).slice(0, 60) : 'Новий пост', rubric: opts.rubric || RUBRICS[0], status:'idea', date: opts.date || '', caption:'', chk:{ca:false, offer:false}, slides, createdAt:Date.now(), updatedAt:Date.now() };
  touch(id); return id;
}

/* ---------- збереження ---------- */
const timers = {};
function setSave(s, msg){ const el = $('#save'); el.dataset.s = s; el.lastElementChild.textContent = msg; }
function touch(id){
  if (!posts[id]) return;
  posts[id].updatedAt = Date.now(); dirty.add(id); setSave('saving', 'Зберігаю…');
  clearTimeout(timers[id]); timers[id] = setTimeout(() => persist(id), 700);
}
async function persist(id){
  const p = posts[id]; if (!p) return;
  try { await store.set('posts', id, clone(p)); dirty.delete(id); setSave('ok', store.db ? 'Збережено' : 'Збережено в браузері'); }
  catch (e){ setSave('error', 'Не збереглось'); toast('Не вдалося зберегти: ' + (e?.message || 'спробуй ще раз')); }
}

/* ---------- UI: загальне ---------- */
let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
function modal(html){ $('#modalBody').innerHTML = html; $('#modal').hidden = false; }
function closeModal(){ $('#modal').hidden = true; $('#modalBody').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

function sortedPosts(){
  return Object.entries(posts).sort((a, b) => (b[1].date || '9999').localeCompare(a[1].date || '9999') || (b[1].updatedAt - a[1].updatedAt));
}
const cur = () => posts[curId];
const curS = () => cur()?.slides[curSlide];

/* ---------- маршрути ---------- */
function view(){ const h = location.hash.slice(1); return ['editor','plan','ideas'].includes(h) ? h : 'editor'; }
function showView(){
  const v = view();
  ['editor','plan','ideas'].forEach(x => $('#view-' + x).hidden = x !== v);
  $$('.tabs a').forEach(a => { if (a.dataset.view === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (v === 'editor') renderEditor(); if (v === 'plan') renderPlan(); if (v === 'ideas') renderIdeas();
}
window.addEventListener('hashchange', showView);
function go(v){ if (location.hash !== '#' + v) location.hash = v; else showView(); }

/* ---------- КОНСТРУКТОР ---------- */
function renderEditor(){
  const ids = Object.keys(posts);
  if (!loaded.posts){ $('#edEmpty').hidden = true; $('#edWork').hidden = true; return; }
  if (!ids.length){ $('#edEmpty').hidden = false; $('#edWork').hidden = true; return; }
  $('#edEmpty').hidden = true; $('#edWork').hidden = false;
  if (!posts[curId]) { curId = sortedPosts()[0][0]; curSlide = 0; }
  curSlide = Math.min(curSlide, cur().slides.length - 1);
  renderPick(); renderStrip(); renderForm(); renderMeta(); renderPreview(); renderChecks();
}
function renderPick(){
  $('#postPick').innerHTML = sortedPosts().map(([id, p]) =>
    `<option value="${id}" ${id === curId ? 'selected' : ''}>${esc(p.title || 'Без назви')}${p.date ? ' · ' + p.date.slice(8,10) + '.' + p.date.slice(5,7) : ''} · ${STATUS_NAME[p.status] || ''}</option>`).join('');
}
function renderStrip(){
  const p = cur(), n = p.slides.length;
  $('#slideCount').textContent = n + (n > 20 ? ' · максимум в Instagram 20' : ' із 20');
  $('#strip').innerHTML = p.slides.map((s, i) =>
    `<button class="thumb" data-act="pick-slide" data-i="${i}" aria-current="${i === curSlide}" aria-label="Слайд ${i+1}"><div class="fit"></div><span>${i+1}. ${esc(TYPES[s.type])}</span></button>`).join('');
  $$('#strip .fit').forEach((w, i) => mount(w, slideHTML(p, p.slides[i], i, n)));
  $('#addSlide').innerHTML = '<option value="">+ Додати слайд…</option>' + Object.entries(TYPES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
}
function renderThumb(){
  const p = cur(), w = $$('#strip .fit')[curSlide]; if (w) mount(w, slideHTML(p, p.slides[curSlide], curSlide, p.slides.length));
}
function renderPreview(){
  const p = cur(), s = curS(); if (!s) return;
  mount($('#preview'), slideHTML(p, s, curSlide, p.slides.length));
  $('#pvLabel').textContent = `${curSlide + 1} / ${p.slides.length} · ${TYPES[s.type]}`;
}

const swatches = (field, val) => `<div class="sw" role="group" aria-label="Колір фону">${Object.keys(PAL).map(c =>
  `<button type="button" data-set="${field}" data-v="${c}" aria-pressed="${val === c}" title="${PAL_NAME[c]}" aria-label="${PAL_NAME[c]}" style="background:${PAL[c]}"></button>`).join('')}</div>`;
const tools = `<div class="tool"><button type="button" data-act="wrap" data-w="**" title="Жирний"><b>Ж</b></button><button type="button" class="i" data-act="wrap" data-w="_" title="Курсив-акцент">К</button><button type="button" data-act="ins" data-v=" → " title="Стрілка">→</button></div>`;
const ta = (f, label, val, rows = 3, ph = '') => `<label class="f" for="f-${f}">${label}${tools}<textarea id="f-${f}" data-f="${f}" rows="${rows}" placeholder="${esc(ph)}">${esc(val || '')}</textarea></label>`;
const range = (f, label, val, min, max, step) => `<div class="range"><label for="f-${f.replace('.','-')}">${label}</label><input type="range" id="f-${f.replace('.','-')}" data-f="${f}" data-num="1" min="${min}" max="${max}" step="${step}" value="${val}"><span>${f.endsWith('zoom') || f === 'scale' ? Math.round(val*100) + '%' : Math.round(val) + '%'}</span></div>`;
function photoBlock(s, label){
  const ph = s.photo;
  return `<div class="sub"><div class="panel-h" style="margin:0">${label}</div>
    <div class="row">
      <label class="btn small" for="f-upload">Завантажити<input type="file" id="f-upload" accept="image/*" hidden></label>
      <button type="button" class="btn small" data-act="lib">З бібліотеки</button>
      ${ph ? '<button type="button" class="btn small ghost danger" data-act="rm-photo">Прибрати</button>' : ''}
    </div>
    ${ph ? range('photo.x','Ліво-право', ph.x ?? 50, 0, 100, 1) + range('photo.y','Верх-низ', ph.y ?? 50, 0, 100, 1) + range('photo.zoom','Масштаб', ph.zoom ?? 1, 1, 3, .05) : ''}
    ${ph && ph.id.startsWith('tmp_') ? '<div class="hint">Це фото тимчасове: сховище фото тут недоступне, тож після перезавантаження сторінки його треба буде додати знову.</div>' : ''}
  </div>`;
}
function renderForm(){
  const s = curS(), p = cur(), i = curSlide, n = p.slides.length;
  let h = `<div class="panel-h">Слайд ${i+1} <span class="row">
      <button type="button" class="btn small" data-act="mv" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="Перемістити ліворуч">←</button>
      <button type="button" class="btn small" data-act="mv" data-d="1" ${i === n-1 ? 'disabled' : ''} aria-label="Перемістити праворуч">→</button>
      <button type="button" class="btn small" data-act="dup-slide">Дублювати</button>
      <button type="button" class="btn small ghost danger" data-act="del-slide" ${n === 1 ? 'disabled' : ''}>Видалити</button></span></div>
    <div class="stack">
    <div class="types" role="group" aria-label="Тип слайду">${Object.entries(TYPES).map(([k, v]) => `<button type="button" class="chip" data-act="type" data-v="${k}" aria-pressed="${s.type === k}">${v}</button>`).join('')}</div>`;
  const t = s.type;
  if (t === 'cover'){
    h += ta('heading','Хук (великий текст на фото)', s.heading, 3, 'Питання або думка, у якій людина впізнає себе');
    h += ta('body','Підзаголовок (необов’язково)', s.body, 2);
    h += photoBlock(s, 'Фото з фотосесії');
  } else if (t === 'split'){
    h += `<label class="f" for="f-heading">Заголовок зверху (необов’язково)<input type="text" id="f-heading" data-f="heading" value="${esc(s.heading)}"></label>`;
    h += `<div class="split-cols">
      <div class="sub"><label class="f" for="f-leftLabel">Ліва половина<input type="text" id="f-leftLabel" data-f="leftLabel" value="${esc(s.leftLabel)}"></label>
        ${ta('leftText','Пункти, кожен з нового рядка', s.leftText, 5)}${swatches('leftBg', s.leftBg)}</div>
      <div class="sub"><label class="f" for="f-rightLabel">Права половина<input type="text" id="f-rightLabel" data-f="rightLabel" value="${esc(s.rightLabel)}"></label>
        ${ta('rightText','Пункти, кожен з нового рядка', s.rightText, 5)}${swatches('rightBg', s.rightBg)}</div></div>`;
  } else if (t === 'notes'){
    h += ta('heading','Заголовок нотатки', s.heading, 2);
    h += ta('body','Текст нотатки', s.body, 5);
    h += photoBlock(s, 'Фото на фоні');
  } else if (t === 'object'){
    h += ta('heading','Заголовок', s.heading, 2);
    h += ta('body','Текст', s.body, 3);
    h += `<div class="f" style="font-size:12.5px;color:var(--muted)">Фон тексту${swatches('bg', s.bg)}</div>`;
    h += photoBlock(s, 'Фото предмета');
  } else if (t === 'mixed'){

/* перевірка */
const GENDER = /(^|[^а-яіїєґ'’])(чолов(ік|іка|іку|іком|іки|іків)|дружин\S*|хлопц\S*|хлопець|дівчин\S*|кохан(ий|а|ого|ої|ому|ій|им|у)|наречен\S*|бойфренд\S*)/gi;
function checks(p){
  const texts = [p.caption, ...p.slides.flatMap(s => [s.heading, s.body, s.leftLabel, s.leftText, s.rightLabel, s.rightText, s.buttons])].filter(Boolean).join('\n');
  const dash = /[—–]|\s-\s/.test(texts);
  const war = /війн/i.test(texts);
  const g = [...new Set([...texts.matchAll(GENDER)].map(m => m[2].toLowerCase()))];
  const s0 = p.slides[0] || {}, s1 = p.slides[1] || {}, sl = p.slides[p.slides.length - 1] || {};
  return [
    { k:'bad', ok:!dash, t:'Без тире', f: dash ? 'Заміни тире на кому або крапку' : '' },
    { k:'bad', ok:!war, t:'Без слова «війна»', f: war ? 'Instagram може обмежити пост' : '' },
    { k:'bad', ok:!g.length, t:'Гендерно нейтрально («партнер»)', f: g.length ? 'Знайдено: ' + g.join(', ') : '' },
    { ok: s0.type === 'cover' && !!plain(s0.heading).trim(), t:'Хук на обкладинці' },
    { ok: s0.type === 'cover' && !!s0.photo, t:'Фото з фотосесії на обкладинці' },
    { ok: s1.type === 'meme', t:'Мем на 2-му слайді, великим планом' },
    { ok: sl.type === 'cta', t:'Останній слайд із закликом до дії' },
    { ok: !!(p.caption || '').trim(), t:'Підпис до посту' },
    { manual:'ca', ok: !!p.chk?.ca, t:'1–2 критерії, у яких ЦА впізнає себе' },
    { manual:'offer', ok: !!p.chk?.offer, t:'Зрозумілий оффер: онлайн-консультація' }
  ];
}
function renderChecks(){
  const list = checks(cur());
  const done = list.filter(c => c.ok).length;
  $('#checks').innerHTML = list.map(c => {
    const cls = c.ok ? 'ok' : (c.k === 'bad' ? 'bad' : 'no');
    if (c.manual) return `<li class="${cls}"><label for="chk-${c.manual}"><input type="checkbox" id="chk-${c.manual}" data-chk="${c.manual}" ${c.ok ? 'checked' : ''}><span>${c.t}</span></label></li>`;
    return `<li class="${cls}"><span class="m">${c.ok ? '✓' : (c.k === 'bad' ? '!' : '·')}</span><span>${c.t}${c.f ? `<br><span class="found">${esc(c.f)}</span>` : ''}</span></li>`;
  }).join('') + `<li class="hint" style="margin-top:4px">Готово ${done} з ${list.length}</li>`;
}

/* оновлення після вводу */
let raf = 0;
function refresh(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { renderPreview(); renderThumb(); renderChecks(); }); }

function setPath(o, path, v){ const k = path.split('.'); let t = o; while (k.length > 1) t = t[k.shift()]; t[k[0]] = v; }

/* події конструктора */
$('#slideForm').addEventListener('input', e => {

$('#postPick').addEventListener('change', e => { curId = e.target.value; curSlide = 0; renderEditor(); });

let lastTA = null;
document.addEventListener('focusin', e => { if (e.target.matches('#slideForm textarea, #slideForm input[type=text]')) lastTA = e.target; });
function editTA(fn){
  const el = lastTA; if (!el || !document.body.contains(el)) { toast('Спершу постав курсор у текст'); return; }
  const a = el.selectionStart, b = el.selectionEnd, v = el.value;
  const r = fn(v.slice(a, b)); el.value = v.slice(0, a) + r.text + v.slice(b);
  el.focus(); el.selectionStart = a + r.selStart; el.selectionEnd = a + r.selEnd;
  el.dispatchEvent(new Event('input', { bubbles:true }));
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act],[data-set]'); if (!b) return;
  if (b.dataset.set){ setPath(curS(), b.dataset.set, b.dataset.v); touch(curId); renderForm(); refresh(); return; }
  const act = b.dataset.act, p = cur();
  switch (act){
    case 'new-post': { curId = newPost(); curSlide = 0; go('editor'); renderEditor(); toast('Пост створено з шаблону'); break; }
    case 'dup-post': { const id = uid(); posts[id] = { ...clone(p), title: p.title + ' (копія)', status:'idea', date:'', createdAt:Date.now() }; posts[id].slides.forEach(s => s.id = uid()); curId = id; curSlide = 0; touch(id); renderEditor(); toast('Копію створено'); break; }
    case 'del-post': modal(`<div class="panel-h" style="margin:0">Видалити «${esc(p.title)}»?</div><p style="margin:0;color:var(--muted)">Пост зникне з конструктора і контент-плану. Фото лишаться в бібліотеці.</p><div class="row"><button class="btn" data-act="close">Скасувати</button><button class="btn primary" data-act="del-post-yes">Видалити</button></div>`); break;
    case 'del-post-yes': { const id = curId; delete posts[id]; dirty.delete(id); clearTimeout(timers[id]); closeModal(); curId = null; try { await store.del('posts', id); toast('Пост видалено'); } catch { toast('Не вдалося видалити'); } renderEditor(); break; }
    case 'close': closeModal(); break;
    case 'pick-slide': curSlide = +b.dataset.i; $$('#strip .thumb').forEach((t, i) => t.setAttribute('aria-current', i === curSlide)); renderForm(); renderPreview(); break;
    case 'prev-slide': if (curSlide > 0){ curSlide--; renderEditor(); } break;
    case 'next-slide': if (curSlide < p.slides.length - 1){ curSlide++; renderEditor(); } break;
    case 'type': { const s = curS(), t = b.dataset.v; if (s.type === t) break; const fresh = blankSlide(t); const keep = { heading:s.heading, body:s.body, photo: s.photo, scale:s.scale };
      p.slides[curSlide] = { ...fresh, ...Object.fromEntries(Object.entries(keep).filter(([k, v]) => v !== undefined && k in fresh)), id:s.id, type:t }; touch(curId); renderEditor(); break; }
    case 'mv': { const d = +b.dataset.d, j = curSlide + d; [p.slides[curSlide], p.slides[j]] = [p.slides[j], p.slides[curSlide]]; curSlide = j; touch(curId); renderEditor(); break; }
    case 'dup-slide': { const c = { ...clone(curS()), id:uid() }; p.slides.splice(curSlide + 1, 0, c); curSlide++; touch(curId); renderEditor(); break; }
    case 'del-slide': p.slides.splice(curSlide, 1); curSlide = Math.max(0, curSlide - 1); touch(curId); renderEditor(); break;
    case 'wrap': { const w = b.dataset.w; editTA(sel => ({ text: w + (sel || 'текст') + w, selStart: w.length, selEnd: w.length + (sel || 'текст').length })); break; }
    case 'ins': editTA(() => ({ text: b.dataset.v, selStart: b.dataset.v.length, selEnd: b.dataset.v.length })); break;
    case 'rm-photo': curS().photo = null; touch(curId); renderForm(); refresh(); break;
    case 'lib': openLibrary(); break;
    case 'lib-pick': pickFromLibrary(b.dataset.id, b.dataset.url); break;
    case 'png-one': exportOne(); break;
    case 'png-all': exportAll(); break;
    case 'copy-text': copyText(b); break;
    case 'week-prev': weekOffset--; renderPlan(); break;
    case 'week-next': weekOffset++; renderPlan(); break;
    case 'week-now': weekOffset = 0; renderPlan(); break;
    case 'open-post': curId = b.dataset.id; curSlide = 0; go('editor'); break;
    case 'new-on-day': curId = newPost({ date:b.dataset.date }); curSlide = 0; go('editor'); break;
    case 'idea-post': { const it = ideas[b.dataset.id]; curId = newPost({ idea: it.text, rubric: it.rubric }); curSlide = 0; go('editor'); toast('Пост створено з ідеї'); break; }
    case 'idea-del': { const id = b.dataset.id; delete ideas[id]; renderIdeas(); try { await store.del('ideas', id); } catch { toast('Не вдалося видалити'); } break; }
    case 'idea-filter': ideaKindFilter = b.dataset.v; renderIdeas(); break;
  }
});

/* фото */
async function prepImage(file){
  try {
    const bmp = await createImageBitmap(file);
    const max = 2400, s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * s), h = Math.round(bmp.height * s);
    const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(bmp, 0, 0, w, h);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .9));
    return { blob, w, h };
  } catch {
    const dims = await imgDims(URL.createObjectURL(file));
    return { blob: file, ...dims };
  }
}
function imgDims(url){ return new Promise(r => { const im = new Image(); im.onload = () => r({ w:im.naturalWidth, h:im.naturalHeight }); im.onerror = () => r({ w:1080, h:1350 }); im.src = url; }); }

$('#slideForm').addEventListener('change', async e => {
  if (e.target.id !== 'f-upload' || !e.target.files[0]) return;
  const file = e.target.files[0]; const sid = curS().id, pid = curId;
  toast('Завантажую фото…');
  const { blob, w, h } = await prepImage(file);
  const assets = await cap('assets');
  let id;
  if (assets){
    try { const r = await assets.upload(blob); id = r.id; }
    catch (err){ toast(err?.code === 'too_large' ? 'Фото завелике, спробуй менше' : 'Не вдалося завантажити фото'); return; }
  } else { id = 'tmp_' + uid(); tempPhotos[id] = URL.createObjectURL(blob); }
  const s = posts[pid]?.slides.find(x => x.id === sid); if (!s) return;
  s.photo = { id, w, h, x:50, y:50, zoom:1 }; touch(pid);
  if (pid === curId && curS()?.id === sid){ renderForm(); refresh(); }
  toast('Фото додано');
});
async function openLibrary(){
  const assets = await cap('assets');
  if (!assets){ toast('Бібліотека фото тут недоступна, завантаж фото з пристрою'); return; }
  modal('<div class="panel-h" style="margin:0">Бібліотека фото <button class="btn small" data-act="close">Закрити</button></div><div class="hint">Завантажую…</div>');
  try {
    const { assets: list } = await assets.list();
    const imgs = list.filter(a => (a.contentType || '').startsWith('image/')).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    $('#modalBody').innerHTML = `<div class="panel-h" style="margin:0">Бібліотека фото <button class="btn small" data-act="close">Закрити</button></div>` +
      (imgs.length ? `<div class="lib">${imgs.map(a => `<button data-act="lib-pick" data-id="${esc(a.id)}" data-url="/_blob/${esc(a.id)}" style="background-image:url('/_blob/${esc(a.id)}')" aria-label="Обрати фото"></button>`).join('')}</div>` : '<p class="hint">Тут з’являться фото, які ти завантажиш у слайди.</p>');
  } catch { $('#modalBody').innerHTML = '<p>Не вдалося відкрити бібліотеку.</p><button class="btn" data-act="close">Закрити</button>'; }
}
async function pickFromLibrary(id, url){
  const sid = curS().id, pid = curId; closeModal();
  const { w, h } = await imgDims(url);
  const s = posts[pid]?.slides.find(x => x.id === sid); if (!s) return;
  s.photo = { id, w, h, x:50, y:50, zoom:1 }; touch(pid); renderForm(); refresh();
}

/* експорт */
function loadImgs(s){
  const u = photoURL(s.photo); if (!u) return Promise.resolve();
  return new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = u; });
}
async function renderBlob(p, i){
  if (!window.html2canvas) throw new Error('бібліотека експорту не завантажилась');
  const host = $('#exportHost'); host.innerHTML = slideHTML(p, p.slides[i], i, p.slides.length);
  await document.fonts.ready; await loadImgs(p.slides[i]);
  const canvas = await html2canvas(host.firstElementChild, { scale:1, width:1080, height:1350, backgroundColor:null, useCORS:true, logging:false, scrollX:0, scrollY:0 });
  host.innerHTML = '';
  return new Promise(r => canvas.toBlob(r, 'image/png'));
}
const slug = p => (p.date || 'bez-daty') + '-' + (p.title || 'karusel').toLowerCase().replace(/[^a-zа-яіїєґ0-9]+/gi, '-').replace(/^-|-$/g, '').slice(0, 40);
async function saveFile(name, blob){
  const dl = await cap('downloads');
  if (!dl){ toast('Завантаження файлів недоступне в цьому вікні'); return; }
  try { await dl.save({ filename:name, data:blob }); toast('Файл збережено'); }
  catch (e){ if (e?.code !== 'declined') toast('Не вдалося зберегти файл' + (e?.message ? ': ' + e.message : '')); }
}
async function exportOne(){
  const p = cur(); toast('Готую PNG…');
  try { await saveFile(`${slug(p)}-${curSlide + 1}.png`, await renderBlob(p, curSlide)); }
  catch (e){ toast('Експорт не вдався: ' + (e?.message || e)); }
}
async function exportAll(){
  const p = cur(); if (!window.JSZip){ toast('Бібліотека архіву не завантажилась'); return; }
  try {
    const zip = new JSZip();
    for (let i = 0; i < p.slides.length; i++){ toast(`Готую слайд ${i + 1} з ${p.slides.length}…`); zip.file(`${String(i + 1).padStart(2, '0')}.png`, await renderBlob(p, i)); }
    if (p.caption) zip.file('pidpys.txt', plain(p.caption));
    await saveFile(slug(p) + '.zip', await zip.generateAsync({ type:'blob' }));
  } catch (e){ toast('Експорт не вдався: ' + (e?.message || e)); }
}
function postText(p){
  const out = [p.title, ''];
  p.slides.forEach((s, i) => {
    out.push(`Слайд ${i + 1} · ${TYPES[s.type]}`);
    if (s.type === 'split'){
      if (s.heading) out.push(plain(s.heading));
      out.push(plain(s.leftLabel) + ':', ...lines(s.leftText).map(plain), '', plain(s.rightLabel) + ':', ...lines(s.rightText).map(plain));
    } else {
      if (s.heading) out.push(plain(s.heading));
      if (s.body) out.push(plain(s.body));
      if (s.type === 'cta' && s.buttons) out.push(...lines(s.buttons).map(plain));
    }
    out.push('');
  });
  if (p.caption) out.push('Підпис до посту:', plain(p.caption));
  return out.join('\n');
}
function copyText(){
  const txt = postText(cur());
  const fallback = () => { modal(`<div class="panel-h" style="margin:0">Текст посту <button class="btn small" data-act="close">Закрити</button></div><textarea id="copyArea" rows="14" readonly>${esc(txt)}</textarea><div class="hint">Виділи текст і скопіюй.</div>`); const a = $('#copyArea'); a.focus(); a.select(); };
  try { navigator.clipboard.writeText(txt).then(() => toast('Текст скопійовано'), fallback); } catch { fallback(); }
}

/* ---------- КОНТЕНТ-ПЛАН ---------- */
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function weekStart(off){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - (d.getDay() + 6) % 7 + off * 7); return d; }
const pcard = (id, p) => `<button class="pc" data-act="open-post" data-id="${id}"><b>${esc(p.title || 'Без назви')}</b><span class="pill st-${p.status}">${STATUS_NAME[p.status] || ''}</span></button>`;
function renderPlan(){
  const ws = weekStart(weekOffset), today = iso(new Date());
  const days = [...Array(7)].map((_, i) => { const d = new Date(ws); d.setDate(ws.getDate() + i); return d; });
  const fmtD = d => d.toLocaleDateString('uk-UA', { day:'numeric', month:'long' });
  $('#weekTitle').textContent = `${fmtD(days[0])} — ${fmtD(days[6])}`;
  const inWeek = Object.entries(posts).filter(([, p]) => p.date >= iso(days[0]) && p.date <= iso(days[6]));
  const cnt = inWeek.length;
  $('#goalText').textContent = `${cnt} з ${WEEK_GOAL} каруселей`;
  $('#goalDots').innerHTML = [...Array(Math.max(WEEK_GOAL, cnt))].map((_, i) => `<i class="${i < cnt ? 'on' : ''}"></i>`).join('');
  $('#week').innerHTML = days.map((d, i) => {
    const key = iso(d); const list = Object.entries(posts).filter(([, p]) => p.date === key);
    return `<div class="day ${key === today ? 'today' : ''}"><div class="day-h"><span>${DAYS[i]}</span><b>${d.getDate()}</b></div>
      ${list.map(([id, p]) => pcard(id, p)).join('')}
      <button class="add-day" data-act="new-on-day" data-date="${key}" aria-label="Новий пост на ${fmtD(d)}">+ пост</button></div>`;
  }).join('');
  const und = Object.entries(posts).filter(([, p]) => !p.date).sort((a, b) => b[1].updatedAt - a[1].updatedAt);
  $('#undated').innerHTML = und.length ? und.map(([id, p]) => `<button class="lrow" data-act="open-post" data-id="${id}"><span class="t"><b>${esc(p.title || 'Без назви')}</b><small>${esc(p.rubric || '')}</small></span><span class="pill st-${p.status}">${STATUS_NAME[p.status]}</span></button>`).join('')
    : `<p class="hint">${loaded.posts ? 'Усі пости мають дату.' : 'Завантажую…'}</p>`;
}

  const list = Object.entries(ideas).filter(([, x]) => !ideaKindFilter || x.kind === ideaKindFilter).sort((a, b) => b[1].createdAt - a[1].createdAt);
  $('#ideaList').innerHTML = list.length ? list.map(([id, x]) => `<div class="idea"><span class="kind">${esc(x.kind)}</span><p>${esc(plain(x.text))}</p><span class="meta">${esc(x.rubric || '')}</span>
      <div class="row"><button class="btn small primary" data-act="idea-post" data-id="${id}">Зробити пост</button><button class="btn small ghost danger" data-act="idea-del" data-id="${id}">Видалити</button></div></div>`).join('')
    : `<p class="hint">${loaded.ideas ? 'Тут збиратимуться теми, хуки, меми й метафори для наступних каруселей.' : 'Завантажую…'}</p>`;
}

/* ---------- старт ---------- */
function applyRemote(col, o){
  const target = col === 'posts' ? posts : ideas;
  const before = col === 'posts' && posts[curId] ? JSON.stringify(posts[curId]) : null;
  for (const id of Object.keys(o)){ if (col === 'posts' && dirty.has(id)) continue; target[id] = o[id]; }
  for (const id of Object.keys(target)){ if (!(id in o) && !(col === 'posts' && dirty.has(id))) delete target[id]; }
  loaded[col] = true;
  const v = view();
  if (col === 'posts'){
    const same = before && posts[curId] && JSON.stringify(posts[curId]) === before;
    if (v === 'editor' && !same) renderEditor();
    if (v === 'plan') renderPlan();
    if (!dirty.size) setSave('ok', store.db ? 'Збережено' : 'Збережено в браузері');
  } else if (v === 'ideas') renderIdeas();
}
async function boot(){
  showView(); cap('assets'); cap('downloads');
  const ok = await store.init();
  if (!ok){
    const b = $('#banner'); b.hidden = false;
    b.textContent = 'Синхронізація між пристроями тут недоступна, тому пости зберігаються лише в цьому браузері.';
  }
  ['posts','ideas'].forEach(col => store.listen(col, (o, err) => {
    if (!o){ loaded[col] = true; setSave('error', 'Немає зв’язку'); const b = $('#banner'); b.hidden = false; b.textContent = 'Не вдалося завантажити дані. Перезавантаж сторінку трохи пізніше.'; showView(); return; }
    applyRemote(col, o);
  }));
}
boot();
})();
</script>
